name: LOGOS ATELIER quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check data.js
          node --check lexicon-v2.js
          node --check rhetoric-v2.js
          node --check audio-coach.js
          node --check app.js
      - name: Run research and user-interface smoke tests
        run: node tests/smoke.cjs
      - name: Check microphone opt-in and disposal in simulated audio session
        run: node tests/audio-coach.cjs
      - name: Check required app files
        run: |
          test -s index.html
          test -s styles.css
          test -s README.md

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
